<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODLOGISTIC | Future Supply Chain</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="particles-js"></div>

    <header>
        <nav class="container">
            <div class="logo">
                <a href="#inici">
                    <!-- Ruta corregida segons la teva estructura /docs/img/ -->
                    <img src="img/logo.png" alt="FoodLogistic Logo" class="logo-img">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="#inici" class="nav-item">Inici</a></li>
                <li><a href="#serveis" class="nav-item">Serveis</a></li>
                <li><a href="#galeria" class="nav-item">Galeria</a></li>
                <li><a href="#contacte" class="nav-item btn-neon">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inici" class="hero">
            <div class="hero-content container">
                <h1 class="glitch" data-text="FOODLOGISTIC">FOODLOGISTIC</h1>
                <p class="subtitle">La revolució de la cadena de fred intel·ligent i el transport quàntic.</p>
                <div class="hero-btns">
                    <a href="#galeria" class="btn-main">Veure Experiència</a>
                </div>
            </div>
            <div class="scan-line"></div>
        </section>

        <!-- NOVA SECCIÓ: GALERIA D'IMATGES (ESTIL STORIES) -->
        <section id="galeria" class="container">
            <p class="gallery-tagline">A Journey Through Visual Logistics</p>
            <h2 class="section-title">Welcome to Our <span class="text-accent">Stories</span></h2>
            
            <div class="gallery-container">
                <div class="photo-card" style="--order: 0; --x: -320px; --y: 15px; --rot: -4deg;">
                    <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&q=80&w=400" alt="Warehouse Tech">
                </div>
                <div class="photo-card" style="--order: 1; --x: -160px; --y: 32px; --rot: 2deg;">
                    <img src="https://images.unsplash.com/photo-1513415277900-a62401e19be4?auto=format&fit=crop&q=80&w=400" alt="Cold Chain">
                </div>
                <div class="photo-card" style="--order: 2; --x: 0px; --y: 8px; --rot: -2deg;">
                    <img src="img/logo.png" alt="Drone Delivery">
                </div>
                <div class="photo-card" style="--order: 3; --x: 160px; --y: 22px; --rot: 3deg;">
                    <img src="https://images.unsplash.com/photo-1610348725531-843dff563e2c?auto=format&fit=crop&q=80&w=400" alt="Quality Control">
                </div>
                <div class="photo-card" style="--order: 4; --x: 320px; --y: 44px; --rot: -3deg;">
                    <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&q=80&w=400" alt="Data Logistics">
                </div>
            </div>
            
            <div class="gallery-footer">
                <button class="btn-submit-neon" style="max-width: 300px;">View All Logistics</button>
            </div>
        </section>

        <!-- FORMULARI DE CONTACTE -->
        <section id="contacte" class="contact container">
            <h2 class="section-title">CONNEXIÓ DIRECTA</h2>
            <div class="contact-wrapper glass">
                <form class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="telefon">Telèfon</label>
                        <input type="tel" id="telefon">
                    </div>
                    <div class="form-group">
                        <label for="missatge">Missatge</label>
                        <textarea id="missatge" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit-neon">Enviar Transmissió</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FOODLOGISTIC S.A. | Desenvolupat per [El teu nom]</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": "#00ffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#00ffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
